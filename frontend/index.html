<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm Tra Chất Lượng Sản Phẩm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
    }
    .container { max-width: 1600px; margin: 0 auto; padding: 8px; }
    
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 15px;
    }
    header h1 { font-size: 1.8em; margin-bottom: 5px; }
    header p { font-size: 0.95em; opacity: 0.9; }
    
    .wrapper {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 15px;
      min-height: calc(100vh - 150px);
    }
    
    .sidebar {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow-y: auto;
    }
    
    .main {
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow-y: auto;
    }
    
    h3 { font-size: 1.1em; margin-bottom: 15px; color: #333; }
    
    .upload-box {
      border: 2px dashed #667eea;
      border-radius: 12px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      background: linear-gradient(135deg, #f8fbff 0%, #f0f4ff 100%);
      margin-bottom: 20px;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
    }
    .upload-box:hover { background: linear-gradient(135deg, #f0f4ff 0%, #e8ecff 100%); border-color: #764ba2; box-shadow: 0 4px 16px rgba(102, 126, 234, 0.2); transform: translateY(-2px); }
    .upload-box.drag { background: linear-gradient(135deg, #e8ecff 0%, #dfe7ff 100%); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3); border-color: #764ba2; }
    
    .upload-icon { font-size: 2.8em; margin-bottom: 12px; }
    .upload-text { font-size: 1.1em; font-weight: 700; color: #667eea; margin-bottom: 5px; }
    .upload-sub { font-size: 0.8em; color: #888; }
    
    #fileInput { display: none; }
    
    #preview {
      max-width: 100%;
      max-height: 140px;
      border-radius: 6px;
      display: none;
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
    }
    
    #fileInfo { 
      font-size: 0.75em; 
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }
    
    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 0.85em;
      color: #333;
    }
    
    .form-group input[type="range"] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #ddd;
      outline: none;
      -webkit-appearance: none;
    }
    .form-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #667eea;
      cursor: pointer;
    }
    .form-group input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #667eea;
      cursor: pointer; border: none;
    }
    
    .value-badge {
      display: inline-block;
      background: #e0e8ff;
      padding: 3px 8px;
      border-radius: 3px;
      color: #667eea;
      font-weight: bold;
      font-size: 0.8em;
    }
    
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 0.95em;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .status {
      padding: 10px 12px;
      border-radius: 6px;
      display: none;
      font-size: 0.85em;
      border-left: 3px solid;
    }
    .status.show { display: block; }
    .status-info { background: #e3f2fd; color: #1976d2; border-left-color: #1976d2; }
    .status-success { background: #e8f5e9; color: #388e3c; border-left-color: #388e3c; }
    .status-error { background: #ffebee; color: #d32f2f; border-left-color: #d32f2f; }
    
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #f3f3f3;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }
    .tab-btn {
      padding: 10px 16px;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      color: #999;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      font-size: 0.95em;
    }
    .tab-btn.active { color: #667eea; border-bottom-color: #667eea; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .result-image {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      margin-bottom: 20px;
    }
    
    .image-section {
      background: linear-gradient(135deg, #f8fbff 0%, #f4f7ff 100%);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #dfe7ff;
    }
    .image-caption { font-size: 0.9em; color: #4b5a7a; margin-bottom: 10px; font-weight: 600; }
    
    .verdict-badge {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 18px;
      border-radius: 8px;
      border-left: 4px solid;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .verdict-icon { font-size: 2.2em; }
    .verdict-status { font-size: 1.2em; font-weight: bold; margin-bottom: 3px; }
    .verdict-desc { font-size: 0.85em; opacity: 0.85; }
    
    .verdict-pass { background: #e8f5e9; border-left-color: #4caf50; color: #1b5e20; }
    .verdict-flag { background: #fff3e0; border-left-color: #ff9800; color: #e65100; }
    .verdict-reject { background: #ffebee; border-left-color: #f44336; color: #b71c1c; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-label { font-size: 0.75em; opacity: 0.9; margin-bottom: 5px; }
    .stat-value { font-size: 1.8em; font-weight: bold; }
    
    .section-title { 
      font-size: 1.15em; 
      margin: 25px 0 18px;
      color: #1a1a1a;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .defect-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      overflow: hidden;
      border: 1px solid #e8ecff;
    }
    .defect-card:hover { 
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2); 
      transform: translateY(-2px);
    }
    
    .defect-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: linear-gradient(135deg, #667eea 0%, #5568d3 100%);
      color: white;
      padding: 14px 16px;
      gap: 12px;
    }
    .defect-name { 
      font-weight: 700; 
      color: white; 
      font-size: 1.05em; 
      flex: 1;
    }
    .severity-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75em;
      font-weight: bold;
      color: white;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    
    .defect-info {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    
    .info-row { 
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px;
      background: #f8fbff;
      border-radius: 8px;
      border: 1px solid #e8ecff;
      transition: all 0.2s;
    }
    .info-row:hover {
      background: #f0f4ff;
      border-color: #667eea;
    }
    
    .info-label { 
      font-weight: 600; 
      color: #667eea; 
      display: flex; 
      align-items: center; 
      gap: 5px;
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .info-value { 
      color: #1a1a1a; 
      font-weight: 700;
      font-size: 1.15em;
    }
    
    .report-box {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      border-left: 3px solid #667eea;
    }
    .report-title { font-weight: 600; color: #667eea; margin-bottom: 8px; font-size: 0.9em; }
    .report-content { font-size: 0.85em; color: #555; line-height: 1.5; }
    
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #999;
    }
    
    .history-item {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      border-left: 3px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-info { flex: 1; }
    .history-time { font-size: 0.8em; color: #999; margin-top: 4px; }
    .history-badge {
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: bold;
      color: white;
      white-space: nowrap;
    }
    .live-panel {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
    }
    .live-panel h4 { margin-bottom: 6px; font-size: 1rem; }
    .live-panel p { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 10px; }
    .stream-controls { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-secondary {
      background: #475569;
      color: #f8fafc;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .stream-status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      margin-bottom: 10px;
      background: rgba(56, 189, 248, 0.16);
      color: #bae6fd;
    }
    .stream-status.error { background: rgba(248, 113, 113, 0.16); color: #fecaca; }
    .stream-status.success { background: rgba(74, 222, 128, 0.16); color: #dcfce7; }
    .stream-frame {
      border-radius: 12px;
      overflow: hidden;
      background: #020617;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .stream-frame img { width: 100%; height: auto; display: block; }
    .stream-placeholder { color: #94a3b8; text-align: center; padding: 24px; }
    .stream-log {
      margin-top: 10px;
      display: grid;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
    }
    .stream-log-item {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.65);
      font-size: 0.8rem;
      color: #e2e8f0;
    }
    
    @media (max-width: 900px) {
      .wrapper { grid-template-columns: 250px 1fr; gap: 10px; }
      .sidebar { padding: 15px; }
      .main { padding: 15px; }
    }
    
    @media (max-width: 768px) {
      .wrapper { grid-template-columns: 1fr; }
      header h1 { font-size: 1.4em; }
      .tabs { margin-bottom: 15px; }
      .defect-info { grid-template-columns: 1fr; }
      .sidebar { max-height: 240px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔍 Kiểm Tra Chất Lượng Sản Phẩm</h1>
      <p>Phát hiện lỗi bằng AI Vision</p>
    </header>
    
    <div class="wrapper">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <h3>📸 Tải Lên Ảnh</h3>
        
        <div class="upload-box" id="uploadBox">
          <div class="upload-icon">📷</div>
          <div class="upload-text">Kéo thả ảnh</div>
          <div class="upload-sub">hoặc nhấp để chọn</div>
        </div>
        
        <input type="file" id="fileInput" accept="image/*">
        <img id="preview" alt="Preview">
        <div id="fileInfo"></div>
        
        <div class="form-group">
          <label>Độ Tin Cậy</label>
          <input type="range" id="confidenceSlider" min="0" max="100" value="25" step="5">
          <div style="margin-top: 5px;">
            <span class="value-badge" id="confidenceValue">0.25</span>
          </div>
        </div>
        
        <button class="btn-primary" id="uploadBtn">🚀 Kiểm Tra</button>

        <div class="live-panel">
          <h4>🎞️ Conveyor Live</h4>
          <p>Giả lập luồng sản phẩm đang chạy trên băng chuyền.</p>
          <div class="stream-controls">
            <button class="btn-primary" id="startConveyorBtn">▶️ Bắt đầu</button>
            <button class="btn-secondary" id="stopConveyorBtn" disabled>⏹️ Dừng</button>
          </div>
          <div class="stream-controls">
            <button class="btn-secondary" id="selectVideoBtn">📹 Chọn video</button>
          </div>
          <input type="file" id="videoInput" accept="video/*" style="display:none;">
          <div class="stream-status" id="videoFileName">Chưa có video</div>
          <div class="stream-status" id="streamStatus">Sẵn sàng</div>
          <div class="stream-frame" id="conveyorFrame">
            <div class="stream-placeholder">Chưa có luồng live</div>
          </div>
          <div class="stream-log" id="conveyorLog"></div>
        </div>

        <div class="status" id="status"></div>
      </div>
      
      <!-- MAIN -->
      <div class="main">
        <div class="tabs">
          <button class="tab-btn active" data-tab="results">📊 Kết Quả</button>
          <button class="tab-btn" data-tab="history">📜 Lịch Sử</button>
        </div>
        
        <div class="tab-content active" id="results">
          <div id="resultsContainer" class="empty-state">
            👆 Tải lên ảnh để xem kết quả
          </div>
        </div>
        
        <div class="tab-content" id="history">
          <div id="historyContainer" class="empty-state">
            Chưa có lịch sử kiểm tra
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const uploadBox = document.getElementById('uploadBox');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const fileInfo = document.getElementById('fileInfo');
    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');
    const confidenceSlider = document.getElementById('confidenceSlider');
    const confidenceValue = document.getElementById('confidenceValue');
    const startConveyorBtn = document.getElementById('startConveyorBtn');
    const stopConveyorBtn = document.getElementById('stopConveyorBtn');
    const selectVideoBtn = document.getElementById('selectVideoBtn');
    const videoInput = document.getElementById('videoInput');
    const videoFileName = document.getElementById('videoFileName');
    const conveyorFrame = document.getElementById('conveyorFrame');
    const conveyorLog = document.getElementById('conveyorLog');
    const streamStatus = document.getElementById('streamStatus');
    
    let selectedFile = null;
    let selectedVideoFile = null;
    let conveyorTimer = null;
    let conveyorFrames = [];
    let conveyorIndex = 0;
    let conveyorRunning = false;
    
    uploadBox.addEventListener('click', () => fileInput.click());
    
    uploadBox.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadBox.classList.add('drag');
    });
    uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('drag'));
    uploadBox.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadBox.classList.remove('drag');
      handleFile(e.dataTransfer.files[0]);
    });
    
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });
    
    function handleFile(file) {
      if (!file) return;
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        preview.style.display = 'block';
        const sizeMB = (file.size / 1024 / 1024).toFixed(2);
        fileInfo.innerHTML = `<strong>${file.name}</strong><br>${sizeMB} MB`;
      };
      reader.readAsDataURL(file);
    }
    
    confidenceSlider.addEventListener('input', (e) => {
      confidenceValue.textContent = (e.target.value / 100).toFixed(2);
    });
    
    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        showStatus('Vui lòng chọn ảnh', 'error');
        return;
      }
      uploadBtn.disabled = true;
      showStatus('<span class="spinner"></span>Đang xử lý...', 'info');
      try {
        const confidence = confidenceSlider.value / 100;
        const result = await apiClient.inspectImage(selectedFile, confidence);
        displayResults(result);
        saveHistory(result);
        showStatus('✅ Kiểm tra thành công!', 'success');
      } catch (error) {
        showStatus('❌ ' + error.message, 'error');
      } finally {
        uploadBtn.disabled = false;
      }
    });

    startConveyorBtn.addEventListener('click', async () => {
      if (conveyorRunning) return;

      if (selectedVideoFile) {
        await processSelectedVideo();
        return;
      }

      try {
        conveyorRunning = true;
        startConveyorBtn.disabled = true;
        stopConveyorBtn.disabled = false;
        setConveyorStatus('Đang tạo luồng live...', 'info');

        const confidence = confidenceSlider.value / 100;
        const payload = await apiClient.simulateConveyor(8, 800, confidence);
        conveyorFrames = payload.frames || [];
        conveyorIndex = 0;

        if (!conveyorFrames.length) {
          throw new Error('Không nhận được khung hình nào');
        }

        setConveyorStatus('Luồng live đang chạy', 'success');
        playNextConveyorFrame();
      } catch (error) {
        conveyorRunning = false;
        startConveyorBtn.disabled = false;
        stopConveyorBtn.disabled = true;
        setConveyorStatus('Lỗi: ' + error.message, 'error');
      }
    });

    stopConveyorBtn.addEventListener('click', () => {
      conveyorRunning = false;
      if (conveyorTimer) {
        clearTimeout(conveyorTimer);
        conveyorTimer = null;
      }
      startConveyorBtn.disabled = false;
      stopConveyorBtn.disabled = true;
      setConveyorStatus('Đã dừng luồng live', 'info');
    });

    selectVideoBtn.addEventListener('click', () => videoInput.click());

    videoInput.addEventListener('change', (e) => {
      selectedVideoFile = e.target.files[0] || null;
      videoFileName.textContent = selectedVideoFile ? `Video: ${selectedVideoFile.name}` : 'Chưa có video';
      videoFileName.className = 'stream-status info';
    });

    async function processSelectedVideo() {
      if (!selectedVideoFile) {
        setConveyorStatus('Vui lòng chọn video trước', 'error');
        return;
      }

      if (conveyorRunning) {
        conveyorRunning = false;
        clearTimeout(conveyorTimer);
        conveyorTimer = null;
      }

      startConveyorBtn.disabled = true;
      stopConveyorBtn.disabled = true;
      setConveyorStatus('Đang phân tích video...', 'info');
      conveyorFrame.innerHTML = '<div class="stream-placeholder">Đang xử lý video...</div>';
      conveyorLog.innerHTML = '';

      try {
        const confidence = confidenceSlider.value / 100;
        const result = await apiClient.processVideo(selectedVideoFile, confidence, 40, 5.0);
        const uniqueImages = result.unique_images_detected || 0;
        const summaryText = `Video: ${result.video_name || selectedVideoFile.name} • ${uniqueImages} ảnh duy nhất • ${result.frames_inspected || 0} frame đã xử lý • ${result.defects_found || 0} ảnh có lỗi`;
        
        // Lưu kết quả để phát lại stream
        window.videoProcessingResult = result;
        window.conveyorVideoFrames = (result.logs || []).filter(log => log.saved_image_url);
        window.conveyorVideoIndex = 0;
        console.log('processSelectedVideo: videoProcessingResult saved:', window.videoProcessingResult);
        console.log('processSelectedVideo: conveyorVideoFrames saved:', window.conveyorVideoFrames);
        
        const summaryItem = document.createElement('div');
        summaryItem.className = 'stream-log-item';
        summaryItem.textContent = summaryText;
        conveyorLog.appendChild(summaryItem);

        (result.logs || []).slice(0, 8).forEach((log) => {
          const item = document.createElement('div');
          item.className = 'stream-log-item';
          item.textContent = `Frame ${log.frame_index} (${log.timestamp}s): ${log.has_defect ? 'có lỗi' : 'đạt'} • ${log.predictions_count || 0} phát hiện`;
          conveyorLog.appendChild(item);
        });

        // Bắt đầu phát video stream từ các frame đã xử lý
        if (window.conveyorVideoFrames.length > 0) {
          setConveyorStatus('Đang phát video stream...', 'success');
          conveyorRunning = true;
          stopConveyorBtn.disabled = false;
          playVideoStream();
        } else {
          setConveyorStatus('Không có frame nào được xử lý', 'error');
        }

        // Hiển thị kết quả chi tiết trên màn hình chính
        renderVideoResultsOnly(result); // Use renderVideoResultsOnly to avoid saving history again
        switchTab('results');
        setConveyorStatus(result.defects_found > 0 ? `Phát hiện ${result.defects_found} frame lỗi` : 'Video đạt tiêu chuẩn', result.defects_found > 0 ? 'error' : 'success');

      const frame = window.conveyorVideoFrames[window.conveyorVideoIndex % window.conveyorVideoFrames.length];

    function setConveyorStatus(message, type = 'info') {
      streamStatus.textContent = message;
      streamStatus.className = `stream-status ${type}`.trim();
    }

    function formatDisplayValue(value, fallback = 'N/A') {
      if (value === null || value === undefined || value === '') return fallback;
      if (typeof value === 'number' || typeof value === 'boolean') return String(value);
      if (typeof value === 'string') return value;
      if (typeof value === 'object') {
        const preferredKeys = ['name', 'label', 'class_name', 'defect_type', 'type', 'value', 'LEVEL', 'SCORE'];
        for (const key of preferredKeys) {
          if (value[key] !== undefined && value[key] !== null && value[key] !== '') {
            return String(value[key]);
          }
        }
        try {
          return JSON.stringify(value);
        } catch (error) {
          return fallback;
        }
      }
      return String(value);
    }

    function normalizeCount(value, fallback = 0) {
      if (typeof value === 'number' && Number.isFinite(value)) return value;
      if (typeof value === 'string') {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : fallback;
      }
      if (value && typeof value === 'object') {
        const candidates = ['count', 'total', 'value', 'defects', 'length'];
        for (const key of candidates) {
          const parsed = Number(value[key]);
          if (Number.isFinite(parsed)) return parsed;
        }
      }
      return fallback;
    }

    }

    function saveHistory(data) {
      let history = JSON.parse(localStorage.getItem('history') || '[]');
      history.unshift({
        type: 'image',
        verdict: data.report?.verdict || 'UNKNOWN',
        time: new Date().toLocaleString('vi-VN'),
        defects: data.total_defects || 0,
        imageUrl: data.result_image_url || null
      });
      localStorage.setItem('history', JSON.stringify(history.slice(0, 50)));
      loadHistory();
    }
    
    function saveVideoHistory(result) {
      let history = JSON.parse(localStorage.getItem('history') || '[]');
      const defectLogs = (result.logs || []).filter(log => log.has_defect);
      const firstDefectImage = defectLogs.length > 0 ? defectLogs[0].saved_image_url : null;
      history.unshift({
        type: 'video',
        verdict: result.defects_found > 0 ? 'REJECT' : 'PASS',
        time: new Date().toLocaleString('vi-VN'),
        defects: result.defects_found || 0,
        videoName: result.video_name || 'Video',
        framesInspected: result.frames_inspected || 0,
        uniqueImages: result.unique_images_detected || 0,
        imageUrl: firstDefectImage || null,
        logs: result.logs || []
      });
      localStorage.setItem('history', JSON.stringify(history.slice(0, 50)));
      loadHistory();
    }

            </div>

    // Restore functions for history items (NOT save to history again)
    function restoreVideoResult(index) {
      const history = JSON.parse(localStorage.getItem('history') || '[]');
      const item = history[index];
      if (item && item.type === 'video' && item.logs) {
        // Manually render video result WITHOUT calling displayVideoResults (which saves history)
        const result = {
          video_name: item.videoName,
          frames_inspected: item.framesInspected,
          defects_found: normalizeCount(item.defects, 0),
          unique_images_detected: item.uniqueImages,
          logs: item.logs
        };
        // Save to window for replay

        window.conveyorVideoFrames = (result.logs || []).filter(log => log.saved_image_url);
        window.conveyorVideoIndex = 0;
        
        // Render directly (bypass saveVideoHistory)

              const imgUrl = `${apiClient.baseUrl}${log.saved_image_url}`;
              return `
                <div style="background: #f8fbff; border-radius: 8px; overflow: hidden; border: ${log.has_defect ? '2px solid #f44336' : '1px solid #e0e0e0'}; cursor: pointer;" onclick="window.open('${imgUrl}', '_blank')">
                  <img src="${imgUrl}" style="width: 100%; height: 120px; object-fit: cover; display: block;">
                  <div style="padding: 6px 8px; font-size: 0.75em; background: ${log.has_defect ? '#ffebee' : '#f5f5f5'};">
                    <div style="font-weight: 600; color: ${log.has_defect ? '#d32f2f' : '#333'};">Frame ${log.frame_index}</div>
                    <div style="color: #666; margin-top: 2px;">${log.timestamp}s • ${log.predictions_count || 0} phát hiện</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      let defectCardsHtml = '';
      if (defectLogs.length > 0) {
        defectCardsHtml = defectLogs.map((log) => {
          const imgUrl = log.saved_image_url ? `${apiClient.baseUrl}${log.saved_image_url}` : null;
          return `
            <div class="defect-card">
              <div class="defect-header">
                <div class="defect-name">⚠️ Frame ${log.frame_index} - Lỗi</div>
                <span class="severity-badge" style="background:#f44336;">${log.predictions_count || 0} phát hiện</span>
              </div>
              <div class="defect-info">
                <div class="info-row">
                  <span class="info-label">⏱ Thời gian</span>
                  <span class="info-value">${log.timestamp}s</span>
                </div>
                <div class="info-row">
                  <span class="info-label">📊 Số phát hiện</span>
                  <span class="info-value">${log.predictions_count || 0}</span>
                </div>
                ${imgUrl ? `
                <div style="grid-column: 1 / -1;">
                  <img src="${imgUrl}" style="width: 100%; border-radius: 6px; border: 1px solid #e0e0e0; cursor: pointer;" onclick="window.open('${imgUrl}', '_blank')" alt="Defect frame ${log.frame_index}">
                </div>` : ''}
              </div>
            </div>
          `;
        }).join('');
      }

      const replayBtnHtml = frameImages.length > 0 ? `
        <button class="btn-primary" style="margin-bottom: 15px; max-width: 300px;" onclick="replayVideoStreamOnMain()">
          ▶️ Xem lại video (${frameImages.length} frames)
        </button>
      ` : '';

      container.innerHTML = `
        <div class="verdict-badge ${defectCount > 0 ? 'verdict-reject' : 'verdict-pass'}">
          <div class="verdict-icon">🎞️</div>
          <div>
            <div class="verdict-status">VIDEO INSPECTION</div>
            <div class="verdict-desc">${summaryText}</div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Ảnh duy nhất</div>
            <div class="stat-value">${uniqueCount}</div>
          </div>
          <div class="stat-box" style="background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);">
            <div class="stat-label">Ảnh đạt</div>
            <div class="stat-value">${passCount}</div>
          </div>
          <div class="stat-box" style="background: linear-gradient(135deg, #f44336 0%, #c62828 100%);">
            <div class="stat-label">Ảnh có lỗi</div>
            <div class="stat-value">${defectCount}</div>
          </div>
        </div>
        ${replayBtnHtml}
        ${frameImages.length > 0 ? `
          <div class="section-title">📹 Frame đã quét (click để xem)</div>
          ${frameGalleryHtml}
        ` : ''}
        ${defectLogs.length > 0 ? `
          <div class="section-title">⚠️ Chi tiết lỗi</div>
          ${defectCardsHtml}
        ` : '<div style="padding: 16px; background: #e8f5e9; border-radius: 8px; color: #2e7d32;">✅ Không phát hiện lỗi</div>'}
      `;
    }
    
    // Function to replay video stream on the main content area
    let mainVideoReplayTimer = null;
    let mainVideoReplayIndex = 0;
    function replayVideoStreamOnMain(result = null) {
      const mainContainer = document.getElementById('mainVideoStreamContainer');
      if (!mainContainer) return;

      const activeResult = result || window.videoProcessingResult;
      console.log('replayVideoStreamOnMain called. Current result:', activeResult);
      if (!activeResult) {
        mainContainer.innerHTML = "<p style='color:#94a3b8; text-align:center;'>Chưa có video để xem lại.</p>";
        return;
      }

      const frames = (activeResult.logs || []).filter(log => log.saved_image_url);
      if (frames.length === 0) {
        mainContainer.innerHTML = "<p style='color:#94a3b8; text-align:center;'>Không có frame ảnh để phát lại.</p>";
        return;
      }

      mainVideoReplayIndex = 0;
      function playNextMainVideoFrame() {
        if (mainVideoReplayIndex >= frames.length) {
          mainVideoReplayIndex = 0; // Loop the video
        }
        const frame = frames[mainVideoReplayIndex];
        const imageUrl = `${apiClient.baseUrl}${frame.saved_image_url}`;

        mainContainer.innerHTML = `
          <img src="${imageUrl}" alt="Frame ${frame.frame_index}" style="width: 100%; border-radius: 12px; border: 1px solid #e0e0e0;">
          <div style="text-align: center; margin-top: 10px; font-size: 0.9em; color: #555;">Đang phát Frame ${frame.frame_index} (${frame.timestamp}s)</div>
        `;

        mainVideoReplayIndex++;
        mainVideoReplayTimer = setTimeout(playNextMainVideoFrame, 500); // 500ms per frame
      }
      // Clear any existing replay before starting new one
      if (mainVideoReplayTimer) clearTimeout(mainVideoReplayTimer);
      playNextMainVideoFrame();
    }

    function replayVideoStream() {
      replayVideoStreamOnMain();
    }

    function restoreImageResult(index) {
      const history = JSON.parse(localStorage.getItem('history') || '[]');
      const item = history[index];
      if (item && item.type === 'image') {
        const imgUrl = item.imageUrl ? resolveImageUrl(item.imageUrl) : null;
        const defectCount = normalizeCount(item.defects, 0);
        const passCount = defectCount > 0 ? 0 : 1;
        const container = document.getElementById('resultsContainer');
        container.innerHTML = `
          <div class="verdict-badge ${item.verdict === 'PASS' ? 'verdict-pass' : item.verdict === 'REJECT' ? 'verdict-reject' : 'verdict-flag'}">
            <div class="verdict-icon">📸</div>
            <div>
              <div class="verdict-status">${item.verdict === 'PASS' ? 'ĐẠT' : item.verdict === 'REJECT' ? 'KHÔNG ĐẠT' : 'CẢNH BÁO'}</div>
              <div class="verdict-desc">Kiểm tra lúc ${item.time}</div>
            </div>
          </div>
          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-label">Tổng Lỗi</div>
              <div class="stat-value">${defectCount}</div>
            </div>
            <div class="stat-box" style="background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);">
              <div class="stat-label">Đạt</div>
              <div class="stat-value">${passCount}</div>
            </div>
          </div>
          ${imgUrl ? `
            <div class="image-section">
              <div class="image-caption">🖼️ Ảnh Kết Quả</div>
              <img src="${imgUrl}" class="result-image" alt="Result">
            </div>
          ` : ''}
        `;
        switchTab('results');
      }
    }
    
    function showStatus(msg, type) {
      status.innerHTML = msg;
      status.className = `status show status-${type}`;
      if (type === 'success') setTimeout(() => status.classList.remove('show'), 3000);
    }
    
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById(tabName).classList.add('active');
    }
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    
    loadHistory();
  </script>
</body>
</html>
